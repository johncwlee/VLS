# Steering parameters for LIBERO / LIBERO-PRO (pi0.5, 10 flow steps).
# Selected automatically from the backend choice (`guidance@main: ${backend}` in config.yaml).
# guide_scale is not set here: the LIBERO adapter supplies it per task
# (backend.libero.task_guide_scales, default 80.0), overriding main.guide_scale.

use_diversity: true
sample_batch_size: 20  # particles; RBF diversity and FK resampling are no-ops at 1
diversity_scale: 20.0
MCMC_steps: 4  # unused by pi0.5 steering

sigmoid_k: 25.0
sigmoid_x0: 0.75

# FKD (Feynman-Kac Diffusion)
use_fkd: true
fkd:
  potential_type: max
  lmbda: 10.0
  adaptive_resampling: true
  resample_frequency: 5
